<!doctype html>
<html lang="es">

<head>
  <!-- ✅ Configuración básica -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ✅ SEO per idioma: títol, descripció, canonical, hreflang, Open Graph i JSON-LD.
       Els genera src/lib/seo-build.ts (plugin "seo" de vite.config.ts). -->
  <!--app-head-->
  <meta name="author" content="Neural Dynamics AI S.L." />

  <!-- ✅ Localización -->
  <meta name="geo.region" content="ES-CT">
  <meta name="geo.placename" content="Vic">
  <meta name="geo.position" content="41.9301;2.2549">
  <meta name="ICBM" content="41.9301, 2.2549">
  <meta name="city" content="Vic">

  <meta name="apple-mobile-web-app-title" content="NDXai">
  <meta name="theme-color" content="#ffffff">

  <!-- ✅ Favicon -->
<link rel="icon" href="/favicon.ico" type="image/x-icon">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">

  <!-- ✅ OPTIMIZACIÓN DE FUENTES (no bloqueante) -->
  <!-- 1. Preconecta para reducir latencia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 2. Preload para priorizar la descarga sin bloquear -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <!-- 3. Carga no bloqueante (solo aplica el estilo al terminar de cargar) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>

  <!-- ✅ Google Analytics (async, no bloquea) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-15LJF6RVRK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-15LJF6RVRK');
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
